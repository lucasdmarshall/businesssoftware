name: Release Desktop Builds

# Builds the Tauri desktop client for both shipping platforms:
#   - macOS  -> .app + .dmg
#   - Windows -> .msi + NSIS .exe installer
# Triggered by a version tag (v*) or manually. Each job uploads its OS's
# installers as build artifacts; publishing to a GitHub Release is left to a
# later, credential-gated step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-installers
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
